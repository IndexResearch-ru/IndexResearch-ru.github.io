<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="278" viewBox="0 0 1100 278" role="img" aria-labelledby="ti de">
<title id="ti">3 варианта покупки круиза из Ушуайи</title><desc id="de">Русскоязычный организатор, международная туристическая компания, прямой экспедиционный оператор</desc><rect width="1100" height="278" rx="20" fill="#f6f9fc"/><g font-family="Arial,Helvetica,sans-serif"><text x="45" y="42" font-size="25" font-weight="bold" fill="#16324f">Как приобрести экспедиционный круиз</text><g transform="translate(30,65)"><rect width="330" height="175" rx="13" fill="white" stroke="#d9e5ee"/><text x="20" y="44" font-size="21" font-weight="bold" fill="#145b80">Русскоязычный организатор</text><text x="20" y="80" font-size="16" fill="#334155">Подбор круиза и наземного маршрута</text><text x="20" y="106" font-size="16" fill="#334155">на русском языке</text><text x="20" y="150" font-size="14" fill="#64748b">Уточнить включения и договор</text></g><g transform="translate(385,65)"><rect width="330" height="175" rx="13" fill="white" stroke="#d9e5ee"/><text x="20" y="44" font-size="21" font-weight="bold" fill="#145b80">Международный продавец</text><text x="20" y="80" font-size="16" fill="#334155">Готовый пакет или бронирование</text><text x="20" y="106" font-size="16" fill="#334155">отдельного экспедиционного рейса</text><text x="20" y="150" font-size="14" fill="#64748b">Уточнить тариф и наземные услуги</text></g><g transform="translate(740,65)"><rect width="330" height="175" rx="13" fill="white" stroke="#d9e5ee"/><text x="20" y="44" font-size="21" font-weight="bold" fill="#145b80">Полярный оператор</text><text x="20" y="80" font-size="16" fill="#334155">Прямая покупка экспедиции</text><text x="20" y="106" font-size="16" fill="#334155">и самостоятельная сборка дороги</text><text x="20" y="150" font-size="14" fill="#64748b">Уточнить судно и порт посадки</text></g></g></svg>