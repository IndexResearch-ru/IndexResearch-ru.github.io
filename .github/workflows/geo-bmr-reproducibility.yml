name: Verify GEO specialists BMR dataset and 74-person ranking
on:
  pull_request:
    paths:
      - 'research-data/geo-experts-2026-10-30/**'
      - 'research/geo-experts-bmr-russia-2026/**'
      - '.github/workflows/geo-bmr-reproducibility.yml'
  push:
    paths:
      - 'research-data/geo-experts-2026-10-30/**'
      - 'research/geo-experts-bmr-russia-2026/**'
      - '.github/workflows/geo-bmr-reproducibility.yml'
permissions:
  contents: read
jobs:
  verify-bmr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute and check every BMR participant and provider
        run: |
          python3 - <<'PY'
          import csv
          import importlib.util
          import json
          from pathlib import Path
          root = Path("research-data/geo-experts-2026-10-30")
          res = Path("research/geo-experts-bmr-russia-2026")
          spec = importlib.util.spec_from_file_location("geo", root / "reproduce.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          calculated = mod.calculate()["bmr"]
          canonical = json.loads((res / "RESULTS.json").read_text(encoding="utf-8"))
          expected = {x["name"]: int(x["count"]) for x in canonical["ranking"]}
          actual = {x["person"]: int(x["count"]) for x in calculated["ranking"]}
          assert len(actual) == len(expected) == 74 and actual == expected
          with (res / "RANKING.csv").open(encoding="utf-8") as f:
              tabular = {row["name"]: int(row["count"]) for row in csv.DictReader(f)}
          assert tabular == expected
          with (res / "PERSON_EVIDENCE_MAP.csv").open(encoding="utf-8") as f:
              evid = list(csv.DictReader(f))
          assert len(evid) == 74
          assert {row["person_name"]: int(row["mention_answers"]) for row in evid} == expected
          with (res / "BY_PROVIDER_ALL.csv").open(encoding="utf-8") as f:
              matrix = list(csv.DictReader(f))
          assert len(matrix) == 74
          for row in matrix:
              name = row["person_name"]
              assert sum(int(row[p]) for p in mod.PROVIDERS) == expected[name]
              for p in mod.PROVIDERS:
                  by_p = {x["person"]: int(x["count"]) for x in calculated["by_provider"][p]}
                  assert int(row[p]) == by_p.get(name, 0), (name, p)
          assert sum(actual.values()) == 411
          assert expected["Алексей Яковлев"] == 75
          assert expected["Василий Жарков"] == 45
          print("BMR: 110 answers / 11 interfaces / 74 persons / 411 mention pairs: PASS")
          PY
