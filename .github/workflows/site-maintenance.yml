name: Site maintenance and QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Balance research ordering
        run: python scripts/reorder_home_research.py

      - name: Rebuild thematic research hubs
        run: python scripts/build_topic_hubs.py

      - name: Normalize analytics on every HTML page
        run: python scripts/ensure_analytics.py

      - name: Materialize shared header/footer and CSS cache version
        run: python scripts/ensure_site_chrome.py

      - name: Normalize structured data, Open Graph and research links
        run: python scripts/ensure_site_metadata.py

      - name: Normalize catalog URLs
        run: python scripts/ensure_catalog_urls.py

      - name: Rebuild sitemap from published HTML pages
        run: python scripts/build_sitemap.py

      - name: Commit automatic maintenance changes
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No automatic maintenance changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml
          git commit -m "Auto-maintain site navigation and sitemap"
          git push

      - name: Verify HTTP to HTTPS redirects
        shell: bash
        run: |
          set -euo pipefail
          for path in "/" "/ratings/" "/en/" "/cn/"; do
            headers="$(curl -sS -I --max-redirs 0 "http://indexresearch.ru${path}")"
            status="$(printf '%s\n' "$headers" | awk 'NR==1 {print $2}')"
            location="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, "", $0); sub(/^[^:]+:[[:space:]]*/, "", $0); print; exit}')"
            expected="https://indexresearch.ru${path}"
            echo "HTTP ${path}: status=${status}, location=${location}"
            if [[ "$status" != "301" && "$status" != "308" ]]; then
              echo "::error::http://indexresearch.ru${path} returned ${status}; expected 301 or 308"
              exit 1
            fi
            if [[ "$location" != "$expected" ]]; then
              echo "::error::http://indexresearch.ru${path} redirects to '${location}'; expected '${expected}'"
              exit 1
            fi
          done

      - name: Run site QA
        run: python scripts/site_qa.py


      - name: Submit changed URLs to IndexNow
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
        run: python scripts/indexnow_submit.py --before "$INDEXNOW_BEFORE"

      - name: Submit all URLs to IndexNow manually
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/indexnow_submit.py --all
