name: INDEX-T066 GEO pricing live browser and link QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-index-t066-live.yml'
      - 'scripts/qa_index_t066_live.py'
      - 'scripts/qa-index-t066-author-links.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium testing dependencies
        run: |
          python -m pip install --quiet playwright
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fonts-noto-cjk >/dev/null
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install --with-deps chromium
          fi
      - name: Test live RU EN CN and links
        run: python scripts/qa_index_t066_live.py
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-t066-step8-live-qa
          path: qa-index-t066/
          retention-days: 7
          if-no-files-found: warn